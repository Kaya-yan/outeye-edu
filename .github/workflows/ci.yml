name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # CI 无 backend/.env（被 gitignore），Settings() 导入期要求下列必填项存在。
      # 值为哑配置：测试全部走 sqlite fixture / mock / 确定性 fallback，不连真实服务。
      SECRET_KEY: ci-dummy-secret-not-production
      JWT_SECRET_KEY: ci-dummy-jwt-not-production
      DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci_dummy"
      REDIS_URL: "redis://localhost:6379/0"
      LLM_API_KEY: ci-dummy-llm-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install minimal test deps
        run: pip install -r requirements-ci.txt
      - name: Pytest（3 个需真实 bge 模型的 EmbeddingService 测试显式跳过）
        run: |
          pytest tests -q \
            --deselect tests/test_rag.py::TestEmbeddingService::test_embed_text \
            --deselect tests/test_rag.py::TestEmbeddingService::test_embedding_dimension \
            --deselect tests/test_rag.py::TestEmbeddingService::test_similarity

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
