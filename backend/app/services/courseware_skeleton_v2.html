<!DOCTYPE html>
<!-- courseware_skeleton_v2 · 框架层 + 主题层（三层架构 ④a；④b 主题库 token 化）
     框架层（本文件写死，模型不生成）：16:9 舞台、翻页导航、键盘事件、页码指示、交互组件 JS。
     主题层：:root 整块 token 组与主题微调样式由后端按所选主题注入（courseware_themes.py），
     内容层只写 var(--token)，换主题对 LLM 透明。
     拼装标记（课件标题、token 组、主题微调样式、页面区注入点）由后端替换——
     注意：本注释不得出现这些标记的字面形式，否则会被 str.replace 误替换。
     对比度契约（WCAG）：每套主题的 ink/text/muted 与四色强调色对该主题 paper/card ≥4.5:1，
     由 tests/test_courseware_themes.py 断言。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
__TOKEN_BLOCK__
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--backdrop);font-family:var(--font-body);color:var(--text)}
#stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;background:var(--paper);transform:scale(var(--fit,1));transform-origin:center;box-shadow:0 12px 48px rgba(30,58,95,.18);overflow:hidden}
.page{position:absolute;inset:0;padding:72px 96px 64px;display:none;flex-direction:column;font-size:var(--fs-body);line-height:var(--lh-body);overflow:hidden}
.page.active{display:flex}
.page h1{font-family:var(--font-title);font-size:var(--fs-title);color:var(--ink);line-height:1.35}
.page h2{font-family:var(--font-title);font-size:var(--fs-h2);color:var(--ink);line-height:1.35}
.page h3{font-size:24px;color:var(--ink);line-height:1.4}
.kicker{font-size:var(--fs-caption);letter-spacing:.32em;color:var(--accent);font-weight:600;margin-bottom:12px}
.accent-rule{width:64px;height:3px;background:var(--accent);margin:16px 0 24px}
.page-focus{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.caption{font-size:var(--fs-caption);color:var(--muted)}
.quote-src{font-size:var(--fs-caption);color:var(--muted);margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.callout{border-left:4px solid var(--accent);background:var(--card);padding:14px 18px;border-radius:0 10px 10px 0}
.hl{background:var(--accent-soft);padding:2px 6px;border-radius:4px}
.cols{display:flex;gap:36px;min-height:0}
.cols>.col{flex:1;min-width:0}
ul.plain{list-style:none}
ul.plain li{padding-left:22px;position:relative}
ul.plain li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:8px;background:var(--accent);border-radius:50%}

/* ============ 交互组件（类契约：内容层只写结构，行为全在骨架） ============ */
details.reveal{border:1px solid var(--line);border-radius:10px;padding:16px 20px;background:var(--card)}
details.reveal summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;font-size:19px}
details.reveal summary::-webkit-details-marker{display:none}
details.reveal summary::before{content:"点击展开　";color:var(--accent);font-size:var(--fs-caption)}
details.reveal[open] summary{margin-bottom:10px}
details.reveal[open] summary::before{content:"点击收起　"}
ol.timeline{list-style:none;display:flex;flex-direction:column;gap:14px}
ol.timeline li{cursor:pointer;padding:12px 18px;border-left:3px solid var(--line);background:var(--card);opacity:.4;transition:opacity .25s,border-color .25s;font-size:19px}
ol.timeline li.lit{opacity:1;border-left-color:var(--accent)}
.vocab-grid{display:flex;flex-wrap:wrap;gap:18px}
.vocab-card{width:196px;height:128px;perspective:900px;cursor:default}
.vocab-card .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}
.vocab-card:hover .inner,.vocab-card.flip .inner{transform:rotateY(180deg)}
.vocab-card .front,.vocab-card .back{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;border:1px solid var(--line);background:var(--card);text-align:center}
.vocab-card .front{font-family:var(--font-title);font-size:27px;font-weight:700;color:var(--ink)}
.vocab-card .front .phonetic{font-family:var(--font-body);font-size:var(--fs-caption);font-weight:400;color:var(--muted);margin-top:6px}
.vocab-card .back{transform:rotateY(180deg);background:var(--ink);color:var(--paper);font-size:16px;line-height:1.7}
.timer{display:inline-flex;align-items:center;gap:16px}
.timer .timer-display{font-family:var(--font-title);font-size:50px;font-weight:700;color:var(--accent);min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.timer button{font:inherit;font-size:16px;padding:8px 24px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.timer button:hover{background:var(--accent);color:var(--paper)}

/* ============ 导航（框架层） ============ */
#nav-prev,#nav-next{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);font-size:19px;cursor:pointer;z-index:40}
#nav-prev{left:14px}
#nav-next{right:14px}
#nav-prev:disabled,#nav-next:disabled{opacity:.25;cursor:default}
#page-indicator{position:absolute;right:22px;bottom:16px;font-size:14px;color:var(--muted);letter-spacing:.08em;z-index:40;font-variant-numeric:tabular-nums}
#deck-title{position:absolute;left:96px;bottom:16px;font-size:12px;color:var(--muted);opacity:.75;z-index:40;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 编辑器模式：V2 编辑器注入 body.oe-edit-all 时全页纵向平铺、隐藏放映导航（纯 CSS，零 JS 改动） */
body.oe-edit-all #stage-wrap{position:static;display:block;background:var(--paper)}
body.oe-edit-all #stage{width:100%;height:auto;transform:none;box-shadow:none}
body.oe-edit-all .page{position:relative;inset:auto;display:flex;min-height:720px;border-bottom:1px solid var(--line)}
body.oe-edit-all #nav-prev,body.oe-edit-all #nav-next,body.oe-edit-all #page-indicator,body.oe-edit-all #deck-title{display:none}

/* 主题级组件微调（后端按所选主题注入，默认空） */
__THEME_EXTRA__
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage">
<!--SECTIONS-->
<button id="nav-prev" aria-label="上一页" type="button">&#8592;</button>
<button id="nav-next" aria-label="下一页" type="button">&#8594;</button>
<div id="page-indicator">1 / 1</div>
<div id="deck-title">__TITLE__</div>
</div></div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();

  var pages = [].slice.call(document.querySelectorAll('.page'));
  var cur = 0;
  var prev = document.getElementById('nav-prev');
  var next = document.getElementById('nav-next');
  var ind = document.getElementById('page-indicator');

  function show(i) {
    cur = Math.max(0, Math.min(pages.length - 1, i));
    pages.forEach(function (p, j) { p.classList.toggle('active', j === cur); });
    prev.disabled = cur === 0;
    next.disabled = cur === pages.length - 1;
    ind.textContent = (cur + 1) + ' / ' + pages.length;
  }
  prev.addEventListener('click', function () { show(cur - 1); });
  next.addEventListener('click', function () { show(cur + 1); });
  window.addEventListener('keydown', function (e) {
    var t = e.target;
    var inControl = t && t.closest && t.closest('button,summary,input,textarea');
    if (inControl) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); show(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (k === 'Home') { show(0); }
    else if (k === 'End') { show(pages.length - 1); }
  });

  document.addEventListener('click', function (e) {
    var li = e.target.closest ? e.target.closest('ol.timeline li') : null;
    if (li) { li.classList.toggle('lit'); return; }
    var btn = e.target.closest ? e.target.closest('.timer button') : null;
    if (!btn) return;
    var wrap = btn.closest('.timer');
    var disp = wrap.querySelector('.timer-display');
    function fmt(s) {
      var m = Math.floor(s / 60), ss = s % 60;
      return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
    }
    if (wrap._running) {
      clearInterval(wrap._timer);
      wrap._running = false;
      btn.textContent = '继续计时';
      return;
    }
    var total = parseInt(wrap.getAttribute('data-seconds') || '60', 10);
    var left = total;
    wrap._running = true;
    disp.textContent = fmt(left);
    btn.textContent = '暂停';
    wrap._timer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(wrap._timer);
        wrap._running = false;
        disp.textContent = '00:00';
        btn.textContent = '再计时一次';
        return;
      }
      disp.textContent = fmt(left);
    }, 1000);
  });

  show(0);
})();
</script>
</body>
</html>
